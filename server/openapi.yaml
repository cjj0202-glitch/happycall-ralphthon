openapi: 3.0.3
info:
  title: OneFlow Local Synthetic Demo
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: server.handlers.health
      responses:
        '200': {description: Local runtime and conservative budget state}
  /api/cases:
    get:
      operationId: server.handlers.list_cases
      responses:
        '200': {description: Synthetic cases. Each case includes a nonnegative integer revision and may include server-owned notificationOutbox intents. Intents with status not_connected have not been externally sent.}
  /api/cases/{case_id}:
    parameters:
      - {name: case_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: server.handlers.get_case
      responses:
        '200': {description: Synthetic case including a nonnegative integer revision. Legacy stored cases start at revision 0 and may omit notificationOutbox. Stored notification intents are not delivery receipts.}
        '404': {description: Case not found}
    patch:
      operationId: server.handlers.patch_case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expectedRevision:
                  type: integer
                  minimum: 0
                  description: Required by the service (428 if omitted). The revision displayed when the user reviewed this form; never refresh it silently before saving.
                intake:
                  type: object
                  additionalProperties: false
                  properties:
                    storeId: {type: string, nullable: true}
                    subject: {type: string, nullable: true}
                    quantity: {type: number, nullable: true, minimum: 0}
                    unit: {type: string, nullable: true}
                    request: {type: string, nullable: true}
                departmentId: {type: string, nullable: true}
                reviewConfirmed: {type: boolean}
                status: {type: string, enum: [draft, review, handed_off, in_progress, closed]}
                reply: {type: string, maxLength: 8000}
                replyTitle: {type: string, minLength: 1, maxLength: 160, description: Optional center-only reply title; legacy replies without a title remain supported.}
                pendingActions: {type: array, items: {type: string}, maxItems: 50}
                selectedEvidence: {type: array, items: {type: string}, maxItems: 50}
      responses:
        '200': {description: Updated case. Workflow changes and optional server-owned notificationOutbox intents share the same committed revision. A successful save is not external notification delivery.}
        '400': {description: Invalid input}
        '403': {description: Demo role not allowed}
        '404': {description: Case not found}
        '409': {description: State conflict}
        '422': {description: Workflow gate failed}
        '428': {description: expectedRevision is required}
  /api/cases/{case_id}/analyze:
    parameters:
      - {name: case_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: server.handlers.analyze_case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: {type: string, enum: [replay, demo-live]}
      responses:
        '200': {description: Explicit-mode analysis with requestId and the saved case revision. Concurrent edits reject the save with STATE_CONFLICT.}
        '409': {description: Audio unavailable or state conflict}
        '422': {description: Input limit}
        '429': {description: Budget reservation stopped request}
        '502': {description: 'Actual AI request failed, no automatic replay'}
        '503': {description: Local credential or fixture unavailable}
  /api/cases/{case_id}/reply-draft:
    parameters:
      - {name: case_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: server.handlers.generate_reply_draft
      parameters:
        - {name: X-Demo-Role, in: header, required: true, schema: {type: string, enum: [center]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: {type: string, enum: [replay, demo-live]}
                expectedRevision: {type: integer, minimum: 0, description: Required by service; missing returns 428.}
                centerContext:
                  type: object
                  additionalProperties: false
                  required: [pendingActions, reply]
                  description: Unverified local center draft; distinct from registered server data and never saved by generation.
                  properties:
                    pendingActions: {type: array, maxItems: 50, items: {type: string, minLength: 1, maxLength: 8000}}
                    reply: {type: string, maxLength: 8000}
                    replyTitle: {type: string, maxLength: 160}
      responses:
        '200':
          description: Review-only draft; never writes case, registered reply, status, history or notifications.
          content:
            application/json:
              schema:
                type: object
                required: [replyTitle, replyDraft, mode, requestId, revision]
                properties:
                  replyTitle: {type: string, minLength: 1, maxLength: 100}
                  replyDraft: {type: string}
                  mode: {type: string, enum: [replay, demo-live]}
                  requestId: {type: string}
                  revision: {type: integer, minimum: 0}
        '403': {description: Center role required}
        '404': {description: Case not found}
        '409': {description: 'Revision changed, invalid state or replay unavailable'}
        '422': {description: Invalid input}
        '428': {description: expectedRevision required}
        '429': {description: Budget reservation rejected}
        '502': {description: AI request failed without automatic replay}
        '503': {description: Credentials or storage unavailable}
  /api/intake:
    post:
      operationId: server.handlers.create_intake
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema: {type: string}
          description: UUID v4 for this intake attempt. Same key and unchanged JSON body return the same case without creating a duplicate. Keep the key after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storeId, subject, text, type]
              properties:
                storeId: {type: string, minLength: 1, maxLength: 100}
                subject: {type: string, minLength: 1, maxLength: 300}
                text: {type: string, minLength: 1, maxLength: 8000}
                type: {type: string, enum: [missing, wrong]}
                referenceCaseId:
                  type: string
                  minLength: 1
                  description: Explicit synthetic source case ID. Store, subject and type must match; omitting it leaves all logistics records unlinked.
      responses:
        '201': {description: 'Created synthetic text case, or current state of the case previously created by the same idempotency key and body'}
        '409': {description: Idempotency key reused with different input}
        '422': {description: Invalid intake}
  /api/intake-attempts/{request_key}:
    get:
      operationId: server.handlers.get_intake_attempt
      parameters:
        - {name: request_key, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Current state of the case created by this intake attempt}
        '404': {description: No stored result found yet. An in-flight request may still finish; retry only the same key and body.}
        '422': {description: Invalid intake attempt key}
