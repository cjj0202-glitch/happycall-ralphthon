name: 편지 (세션 간 지시·요청)
description: 다른 노트북 세션에게 보내는 편지. 상대는 이 대화의 앞부분을 모릅니다.
title: "[결론 한 줄 — 인사·서론 금지] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        🚨 **상태 보고는 편지가 아닙니다.** `python channel/mail.py status --set "..."` 를 쓰십시오.
        상태 보고가 전체의 51.5% 입니다. 편지로 만들면 편지함이 덮여 진짜 지시가 묻힙니다.

        🚨 **시크릿 값을 붙여넣지 마십시오.** 경로만 적습니다.

  - type: dropdown
    id: to
    attributes:
      label: 받는 PC
      options: [pc1, pc2, pc3, pc4]
    validations: {required: true}

  - type: dropdown
    id: type
    attributes:
      label: 유형
      options:
        - A-즉시조치 — 상대가 실행해야 한다
        - C-결정요청 — 사람 승인이 낀다 (가장 오래 걸린다. 일찍 띄울 것)
        - D-규칙전달 — 규칙·설계·인터페이스 계약
        - E-경고정정 — 판정이 틀렸다 / 위험한 명령을 멈춰라
        - F-자료전달 — 산출물 «경로» (값 아님)
    validations: {required: true}

  - type: input
    id: from
    attributes:
      label: 보낸 PC / 세션
      description: 슬롯과 세션을 적습니다. 한 PC 에 세션이 여럿입니다.
      placeholder: pc1 / main — 통합세션
    validations: {required: true}

  - type: textarea
    id: why
    attributes:
      label: 왜 지금
      description: 배경 2~3줄. 상대는 앞부분을 모릅니다.
    validations: {required: true}

  - type: textarea
    id: todo
    attributes:
      label: 해줘야 할 일
      value: |
        - [ ]
        - [ ]
    validations: {required: true}

  - type: textarea
    id: how
    attributes:
      label: 실행 명령
      description: 복붙 가능하게. 🚨 상대 PC 기준 절대경로.
      render: bash
    validations: {required: true}

  - type: textarea
    id: verify
    attributes:
      label: 검증 방법 + 기대값
      description: |
        🚨 「에러 없음」은 검증이 아닙니다. 기대값이 없으면 받는 쪽이 자기 자로 재서 통과시킵니다.
      placeholder: |
        `curl localhost:5000/api/health` → `{"ok":true,"count":27}`
        count 가 27 이 아니면 실패로 보고 회신할 것
    validations: {required: true}

  - type: input
    id: stop
    attributes:
      label: 중단 조건
      placeholder: 권한 거부되면 멈추고 회신. 임의로 밀어붙이지 말 것
    validations: {required: true}
