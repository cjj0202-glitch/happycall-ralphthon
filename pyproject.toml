[project]
name = "oneflow-demo"
version = "0.1.0"
description = "Local synthetic OneFlow demo API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "connexion[uvicorn]>=3.2,<4",
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mangum>=0.19,<1",
  "openai>=1.68,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
